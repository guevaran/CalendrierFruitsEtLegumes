AutoName: Calendrier Fruits et Legumes
Summary: Fruits, legumes et cereales de saison en France
Description: |
  Application libre qui aide a choisir des fruits, legumes et cereales de saison en France.
  - Recherche par mois
  - Affichage rapide avec images WebP
  - Theme simple avec police locale Handlee
  - Pas de suivi, pas de pubs

RepoType: git
Repo: https://github.com/guevaran/CalendrierFruitsEtLegumes.git

Builds:
  - versionName: 1.0.0
    versionCode: 3
    commit: v1.0.0
    subdir: .
    gradle:
      - yes
    output: "['build/app/outputs/flutter-apk/app-release.apk']"
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
    prebuild: sdkmanager --licenses || true
    build: ./gradlew assembleRelease

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 3
