AutoName: Calendrier Fruits et Légumes
RepoType: git
Repo: https://github.com/guevaran/CalendrierFruitsEtLegumes.git

# Optional summary/description
Summary: Fruits, légumes et céréales de saison en France
Description: |
  Application libre qui aide à choisir des fruits, légumes et céréales de saison en France.
  - Recherche par mois
  - Affichage rapide avec images WebP
  - Thème simple avec police locale Handlee
  - Pas de suivi, pas de pubs

# Anti-features (leave empty unless really applicable)
AntiFeatures:

# Build metadata
Builds:
  - versionName: 1.0.0
    versionCode: 3
    commit: v1.0.0
    subdir: .
    gradle:
      - yes
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
    srclibs:
    prebuild:
      - sdkmanager --licenses || true
    build:
      - ./gradlew assembleRelease
    output:
      - build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: ^v(.*)$
CurrentVersion: 1.0.0
CurrentVersionCode: 3

RequiresRoot: False
