name: calendrier_fruits_et_legumes
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  scrollable_positioned_list: ^0.3.8
  linked_scroll_controller: ^0.2.0
  url_launcher: ^6.1.12
  simple_icons: ^7.10.0
  flutter_launcher_icons: ^0.13.1
  shared_preferences: ^2.2.1

flutter_launcher_icons:
  image_path: "assets/logo/logo_square_bg.png"
  adaptive_icon_foreground: "assets/logo/logo_adaptive.png"
  android: true
  ios: true
  adaptive_icon_background: "#9DD2A8"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  typed_data: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/json/
    - assets/imgs/
    - assets/logo/
    - assets/google_fonts/
  fonts:
    - family: Handlee
      fonts:
        - asset: assets/google_fonts/Handlee-Regular.ttf